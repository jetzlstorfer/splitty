version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/api"
    schedule:
      interval: monthly
    groups:
      npm:
        patterns:
          - "*"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
