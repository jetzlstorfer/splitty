name: Check
on:
  pull_request:
  workflow_call:
    inputs:
      run-e2e:
        description: Install browsers and run the Playwright suite
        type: boolean
        default: true
      upload-build:
        description: Upload checked frontend and API builds for deployment
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - run: npm ci
      - run: npm ci --prefix api
      - run: npm run lint
      - run: npm test
      - run: npm run check:e2e
      - run: npm run build && npm run build:api
      - name: Start isolated table emulator
        run: |
          mkdir -p "$RUNNER_TEMP/splitty-azurite"
          api/node_modules/.bin/azurite-table --silent --skipApiVersionCheck --location "$RUNNER_TEMP/splitty-azurite" &
          for attempt in {1..30}; do
            if curl --silent --output /dev/null http://127.0.0.1:10002/; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm test -- tests/api.integration.test.ts
        env:
          RUN_AZURE_TESTS: "1"
      - name: Resolve Playwright version
        id: playwright
        if: ${{ github.event_name == 'pull_request' || inputs.run-e2e }}
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        if: ${{ github.event_name == 'pull_request' || inputs.run-e2e }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-webkit
      - name: Install Playwright browsers
        if: ${{ (github.event_name == 'pull_request' || inputs.run-e2e) && steps.playwright-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium webkit
      - name: Install Playwright system dependencies
        if: ${{ (github.event_name == 'pull_request' || inputs.run-e2e) && steps.playwright-cache.outputs.cache-hit == 'true' }}
        timeout-minutes: 10
        run: npx playwright install-deps chromium webkit
      - run: npm run test:e2e
        if: ${{ github.event_name == 'pull_request' || inputs.run-e2e }}
      - name: Upload checked builds
        if: ${{ inputs.upload-build }}
        uses: actions/upload-artifact@v7
        with:
          name: deployment-build
          path: |
            dist
            api/dist
          if-no-files-found: error
