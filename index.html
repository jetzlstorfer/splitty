<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("scoutTheme");
        const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
        const updateTheme = () => {
          const theme = param === "light" || param === "dark"
            ? param
            : systemTheme.matches ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
          document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#1c2524" : "#ffffff";
        };
        updateTheme();
        if (param !== "light" && param !== "dark") {
          systemTheme.addEventListener("change", updateTheme);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Gemeinsame Ausgaben einfach teilen. Auch offline und nur für zwei." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Splitty · Gemeinsame Ausgaben</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
